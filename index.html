<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Diary</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="font-sans bg-[#ecfeff]">
    <a id="top"></a>

    <!----------------------------- Navbar start --------------------------->
    <nav
      class="bg-white p-4 flex flex-wrap items-center justify-between fixed top-0 left-0 right-0 z-50 shadow-md"
    >
      <!-- Name: Movie Diary -->
      <div>
        <h1 class="text-4xl font-bold text-[#1e40af]">Movie Diary</h1>
      </div>

      <!-- Tabs -->
      <div
        class="flex flex-wrap justify-center sm:justify-start sm:space-x-10 mt-2"
      >
        <a
          href="index.html"
          class="border-2 border-[#3b82f6] text-[#3b82f6] font-bold px-7 py-3 rounded-md hover:bg-[#dbeafe] transition text-sm text-center w-full sm:w-auto"
          >HomePage</a
        >
        <a
          href="journal.html"
          class="border-2 border-[#3b82f6] text-[#3b82f6] font-bold px-7 py-3 rounded-md hover:bg-[#dbeafe] transition text-sm text-center w-full sm:w-auto"
          >Journal</a
        >
      </div>
    </nav>

    <!----------------------------- Home start ----------------------------->

    <section id="homepage" class="pt-32 pb-10 text-center">
      <div class="max-w-xl mx-auto"></div>
      <!-- Title -->
      <h2 class="text-3xl font-bold font-sans text-[#1e40af] mb-6">
        Popular movies <span class="movies">🎬</span>
      </h2>

      <!-- Subtitle -->
      <p class="text-[#1e3a8a] text-lg mb-8">
        Search your favorite movies and save it in your favourites!
      </p>

      <!-- Seach engine -->
      <form id="search-form" class="flex justify-center">
        <input
          type="text"
          id="search-input"
          placeholder="Search a movie..."
          class="border border-gray-300 rounded-l-lg px-4 py-2 w-full max-w-xl focus:outline-none focus:ring-blue-500 mb-8"
          required
        />
        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded-r-lg hover:bg-blue-700 font-semibold transition cursor-pointer mb-8"
        >
          Search
        </button>
      </form>

      <!-- Search dialog -->
      <dialog id="search-dialog" class="p-4 rounded shadow-xl w-96">
        <h2 class="text-xl font-bold mb-4">Search Results</h2>
        <div id="dialog-content"></div>
        <button
          id="dialog-close"
          class="mt-4 bg-gray-700 text-white px-3 py-2 rounded transition cursor-pointer"
        >
          Close
        </button>
      </dialog>

      <!-- Movies list-->
      <div
        id="movies-container"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>

      <!-- Here will be all the cards of the movies -->
    </section>

    <script src="main.js"></script>
  </body>
</html>
